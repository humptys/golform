<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c110f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GolForm">
  <title>GolForm 골프 자세 교정</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>GolForm</h1>
    <span class="sub">골프 자세 교정</span>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="analyze"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>분석</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>기록</button>
    <button data-tab="refs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h10l-2 3.5L16 11H6"/></svg>기준</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>설정</button>
  </nav>
  <script>
    // 서비스 워커가 처음 자리 잡으면 한 번 새로고침해, 브라우저가 붙잡고 있던 예전 파일 대신 최신 파일로 다시 연다.
    if ('serviceWorker' in navigator) {
      var hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (!hadWorker) navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); }, { once: true });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GolForm">
  <title>GolForm 골프 자세 교정</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>GolForm</h1>
    <span class="sub">골프 자세 교정</span>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="analyze">분석</button>
    <button data-tab="history">기록</button>
    <button data-tab="refs">기준 영상</button>
    <button data-tab="settings">설정</button>
  </nav>
  <script>
    // 서비스 워커가 처음 자리 잡으면 한 번 새로고침해, 브라우저가 붙잡고 있던 예전 파일 대신 최신 파일로 다시 연다.
    if ('serviceWorker' in navigator) {
      var hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (!hadWorker) navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); }, { once: true });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
